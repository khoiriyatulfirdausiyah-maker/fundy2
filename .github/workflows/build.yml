name: Build FUNDY APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check Project
        run: |
          echo "=== FUNDY PROJECT ==="
          ls -la
          echo "=== APP ==="
          ls -la app

      - name: Build FUNDY Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Find APK
        run: |
          echo "=== APK RESULT ==="
          find . -type f -name "*.apk" -print

      - name: Upload FUNDY APK
        uses: actions/upload-artifact@v4
        with:
          name: FUNDY-v2.79-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
